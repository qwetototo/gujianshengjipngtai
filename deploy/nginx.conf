limit_req_zone $binary_remote_addr zone=ota_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ota_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ota_uploads:10m;
# 纯 HTTP 版本（暂无 TLS 证书）。后续拿到证书后改回 listen 443 ssl 并恢复证书配置。
server {
    listen 80;
    server_name 1.15.88.116;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 220m;
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/auth/login {
        limit_req zone=ota_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
    }

    location /api/ {
        limit_req zone=ota_api burst=60 nodelay;
        limit_req_status 429;
        limit_conn ota_uploads 20;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
