server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: ${OTA_MAX_FILE_SIZE:200MB}
      max-request-size: ${OTA_MAX_REQUEST_SIZE:220MB}
  datasource:
    url: ${OTA_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/ceshi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false&sslMode=PREFERRED}
    username: ${OTA_DATABASE_USERNAME:root}
    password: ${OTA_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${OTA_DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    property-naming-strategy: SNAKE_CASE

ota:
  storage-dir: ${OTA_STORAGE_DIR:E:/固件暂存}
  object-storage:
    backend: ${OTA_OBJECT_STORAGE_BACKEND:filesystem}
    endpoint: ${OTA_OBJECT_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${OTA_OBJECT_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${OTA_OBJECT_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${OTA_OBJECT_STORAGE_BUCKET:ota-firmware}
  storage:
    warning-free-percent: ${OTA_STORAGE_WARNING_FREE_PERCENT:15}
    warning-free-bytes: ${OTA_STORAGE_WARNING_FREE_BYTES:10737418240}
    upload-reserve-bytes: ${OTA_STORAGE_UPLOAD_RESERVE_BYTES:2147483648}
  auth:
    username: ${OTA_ADMIN_USERNAME:admin}
    password: ${OTA_ADMIN_PASSWORD:}
    require-strong-password: ${OTA_REQUIRE_STRONG_PASSWORD:false}
  cors:
    allowed-origins: ${OTA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

logging:
  level:
    root: INFO
