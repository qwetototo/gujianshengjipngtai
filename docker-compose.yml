services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ota_console
      MYSQL_USER: ota_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [ota_internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &default_logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTA_DATABASE_URL: jdbc:mysql://mysql:3306/ota_console?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
      OTA_DATABASE_USERNAME: ota_app
      OTA_DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      OTA_ADMIN_PASSWORD: ${OTA_ADMIN_PASSWORD:?set OTA_ADMIN_PASSWORD in .env}
      OTA_REQUIRE_STRONG_PASSWORD: ${OTA_REQUIRE_STRONG_PASSWORD:-false}
      OTA_STORAGE_DIR: /var/lib/ota/firmware
      OTA_FIRMWARE_HISTORY_RETAIN_COUNT: ${OTA_FIRMWARE_HISTORY_RETAIN_COUNT:-5}
      OTA_OBJECT_STORAGE_BACKEND: filesystem
      OTA_MAX_FILE_SIZE: 200MB
      OTA_MAX_REQUEST_SIZE: 220MB
    volumes:
      - type: bind
        source: ${OTA_STORAGE_PATH:-E:/固件暂存}
        target: /var/lib/ota/firmware
    tmpfs:
      - /tmp/ota-upload:rw,noexec,nosuid,size=512m,mode=1777
    depends_on:
      mysql: { condition: service_healthy }
    networks: [ota_internal]
    logging: *default_logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-18080}:80"]
    depends_on: [backend]
    networks: [ota_internal, ota_frontend]
    logging: *default_logging

networks:
  ota_internal:
    driver: bridge
    internal: true
  ota_frontend:
    driver: bridge

volumes:
  mysql_data:
